[project]
name = "twy"
version = "0.1.0"
description = "A terminal app for running The 12 Week Year"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80",
    "textual-plotext>=0.2",
    "platformdirs>=4.0",
]

[project.scripts]
twy = "twy.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
