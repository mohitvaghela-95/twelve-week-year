[project]
name = "twy"
version = "0.1.0"
description = "A web app for running The 12 Week Year on your home network"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "gunicorn>=22.0",
    "platformdirs>=4.0",
]

[project.scripts]
twy-web = "twy.web.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
